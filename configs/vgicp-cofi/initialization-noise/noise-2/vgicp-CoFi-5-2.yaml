output_path: experiments/vgicp-128-cofi-init-noise
transforms_path: /mnt/work/users/aleix.armero/transforms/vgicp-128-imu.npy
overlap_threshold: 1.0
checkpoint_every : 100

registration_method:
  name: vgicp-cofi
  params: {
    initial_voxel_size : 2,
    fine_voxel_size: 0.2,
    steps: 5,
    voxel_resolution : 4.0,
    num_threads : 4,
    use_initialization: true
  }          # forwarded as **kwargs to load_method

dataset:
  name: v2x_real
  params:            # forwarded as **kwargs to load_dataset
    root_dir : /mnt/work/datasets/V2X-Real/V2X-Real-Lidar-128/train
    position_noise : 2
    angular_noise : 25
    
metrics:
  - name: point_based
    params: {
      rte_threshold : 0.2,
      rre_threshold : 0.2
    }