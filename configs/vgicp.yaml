output_path: experiments/vgicp
transforms_path: transforms/vgicp
overlap_threshold: 1.0
checkpoint_every : 100

registration_method:
  name: vgicp
  params: {voxel_size : 0.5, voxel_resolution : 1.0, correspondance_distance : 1, num_threads : 4}          # forwarded as **kwargs to load_method

dataset:
  name: v2x_real
  params:            # forwarded as **kwargs to load_dataset
    root_dir : /mnt/work/datasets/V2X-Real/V2X-Real-Lidar-64/train
    
metrics:
  - name: point_based
    params: {
      rte_threshold : 0.2,
      rre_threshold : 0.2
    }