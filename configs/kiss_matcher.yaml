output_path: experiments/kiss_matcher-128
transforms_path: transforms/kiss_matcher-128
overlap_threshold: 1.0
checkpoint_every : 100

registration_method:
  name: kiss_matcher
  params: {voxel_size : 0.2}          # forwarded as **kwargs to load_method

dataset:
  name: v2x_real
  params:            # forwarded as **kwargs to load_dataset
    root_dir : /mnt/work/datasets/V2X-Real/V2X-Real-Lidar-128/train
    
metrics:
  - name: point_based
    params: {
      rte_threshold : 0.2,
      rre_threshold : 0.2
    }