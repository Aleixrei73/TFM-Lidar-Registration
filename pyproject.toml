[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tfm-lidar-registration"
version = "0.1.0"
description = "Evaluator of multiple registration algorithms for point cloud datasets in Autonomous Driving"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "scipy",
    "open3d",
    "pyyaml",
    "click",
    "tqdm",
    "rosbags"
]

[project.optional-dependencies]
# Not on PyPI in all environments, see the README installation section
registration = [
    "small_gicp",
    "kiss-matcher"
]
plots = [
    "matplotlib",
    "seaborn"
]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["datasets", "metrics", "registration", "ros_utils", "utils"]
# Top-level modules imported by the CLI (`from pipeline import ...`)
py-modules = ["main", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "test", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["S101"]
